<body>
  <div id="instructions">
    <strong>Rectilinear Volumes</strong><br />
    Click a face to select it. Drag <em>sideways</em> to move the cube,
    drag <em>outward</em> to push/pull that face.<br />
    Double-click, or Tab / Shift+Tab, to select a whole cube. Escape clears.<br />
    Left/Right arrows rotate the group. Up/Down arrows or scroll to zoom.
  </div>
